name: Update profile stats

on:
  schedule:
    - cron: "17 0 * * *"      # every day at 05:17 Pakistan time
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab
  push:
    paths: ["profile.json", "generate.py", "portrait.json"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats and rebuild SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python update_stats.py
      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update stats"
          git push
